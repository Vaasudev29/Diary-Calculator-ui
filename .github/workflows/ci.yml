name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
    - name: Cache pip wheels
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip/wheels
        key: ${{ runner.os }}-pip-wheels-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-wheels-${{ matrix.python-version }}-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov
        pip install flake8 mypy
    - name: Run unit tests (exclude integration) with coverage
      run: |
        python -m pytest --cov=./ --cov-report=xml -q -m "not integration"
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-unit
        path: coverage.xml
    - name: Parse coverage
      id: parse_coverage
      run: |
        COVERAGE=$(python - <<'PY'
import xml.etree.ElementTree as ET
tree=ET.parse('coverage.xml')
root=tree.getroot()
coverage=float(root.get('line-rate', '0'))*100
print(f"{coverage:.2f}")
PY
)
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
    - name: Check coverage threshold
      id: check_threshold
      run: |
        # prefer secret COVERAGE_THRESHOLD, fallback to .github/coverage_threshold.txt
        THRESHOLD="${{ secrets.COVERAGE_THRESHOLD }}"
        if [ -z "$THRESHOLD" ]; then
          if [ -f .github/coverage_threshold.txt ]; then
            THRESHOLD=$(cat .github/coverage_threshold.txt)
          else
            THRESHOLD=70
          fi
        fi
        echo "Using coverage threshold: $THRESHOLD"
        python - <<PY
import os, sys
coverage=float('${{ steps.parse_coverage.outputs.coverage }}')
threshold=float(os.getenv('THRESHOLD','70'))
print(f'Coverage: {coverage} Threshold: {threshold}')
if coverage < threshold:
    print('Coverage below threshold')
    sys.exit(1)
print('Coverage OK')
PY
        echo "threshold=$THRESHOLD" >> $GITHUB_OUTPUT
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const coverage = parseFloat(process.env.COVERAGE || '${{ steps.parse_coverage.outputs.coverage }}');
          const threshold = process.env.THRESHOLD || (process.env.COVERAGE_THRESHOLD || '70');
          const body = `Unit test coverage: ${coverage.toFixed(2)}% (threshold: ${threshold}%)`;
          github.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      env:
        COVERAGE: ${{ steps.parse_coverage.outputs.coverage }}
        THRESHOLD: ${{ steps.check_threshold.outputs.threshold }}
    - name: Run flake8
      run: |
        flake8 . --max-line-length=120 || true
    - name: Run mypy
      run: |
        mypy . --ignore-missing-imports || true

  integration-tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-3.10-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-3.10-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov
    - name: Run integration tests with coverage
      run: |
        python -m pytest --cov=./ --cov-report=xml -q -m integration
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-integration
        path: coverage.xml
    - name: Upload full test artifacts (history/presets)
      uses: actions/upload-artifact@v4
      with:
        name: data-artifacts
        path: data/
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage.xml
        flags: integration
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
